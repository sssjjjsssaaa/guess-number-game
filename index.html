<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ec">
  <meta name="description" content="一个随手就能玩的猜数字小游戏。根据大小提示，找出电脑选中的秘密数字。">
  <meta property="og:title" content="猜个数 · 来试试你的直觉">
  <meta property="og:description" content="我心里有个数。你能用几次猜中？">
  <title>猜个数 · 手机小游戏</title>
  <style>
    :root { color-scheme: light; --paper:#f5f3ec; --ink:#222b38; --muted:#767b83; --blue:#3859e8; --line:#e5e5df; --green:#197552; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; -webkit-font-smoothing:antialiased; }
    button,input { font:inherit; }
    button { touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
    button:focus-visible,input:focus-visible { outline:3px solid #f5ac49; outline-offset:4px; }
    .shell { width:min(100% - 40px,430px); margin:auto; padding:calc(27px + env(safe-area-inset-top)) 0 calc(25px + env(safe-area-inset-bottom)); }
    .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:27px; }
    .brand { font-weight:850; font-size:19px; letter-spacing:-.8px; display:flex; align-items:center; gap:8px; }
    .brand-mark { display:grid; place-items:center; width:27px; height:27px; background:var(--ink); color:white; border-radius:8px; font-size:19px; font-family:monospace; transform:rotate(-7deg); }
    .restart { border:1px solid #d8dbd7; padding:9px 13px; background:transparent; color:#525a66; border-radius:99px; cursor:pointer; font-size:12px; font-weight:650; min-height:40px; }
    .restart:hover { background:white; }
    .hero { text-align:center; }
    .eyebrow { display:inline-flex; align-items:center; gap:6px; margin:0 0 11px; font-size:11px; letter-spacing:1.5px; color:#656b75; font-weight:700; }
    .eyebrow::before { content:""; width:6px; height:6px; background:var(--blue); border-radius:50%; }
    h1 { font-size:clamp(30px,8vw,37px); line-height:1.25; letter-spacing:-1.8px; margin:0 0 10px; font-weight:850; }
    .intro { font-size:14px; line-height:1.7; color:#747985; margin:0; }
    .number-stage { position:relative; height:135px; display:grid; place-items:center; margin:7px auto 4px; width:min(300px,100%); isolation:isolate; }
    .orbit { position:absolute; border:1px dashed #d4d7db; border-radius:50%; width:225px; height:90px; transform:rotate(-14deg); z-index:-1; }
    .mystery { background:#e6ebff; color:var(--blue); width:83px; height:97px; border-radius:20px; box-shadow:5px 6px 0 #d2dafb; display:grid; place-items:center; font:850 66px/1 ui-rounded,"Segoe UI",sans-serif; transform:rotate(-7deg); transition:transform .25s,background .25s,color .25s; }
    .mystery.solved { transform:rotate(0); background:#dff3e7; color:var(--green); box-shadow:5px 6px 0 #c4e7d2; font-size:50px; }
    .float-number { position:absolute; font-weight:750; font-size:19px; color:#858e9c; }
    .float-number.left { left:26px; top:38px; transform:rotate(-17deg); }
    .float-number.right { right:24px; bottom:27px; transform:rotate(13deg); color:#c48d40; }
    .spark { position:absolute; right:46px; top:21px; color:#e7a541; font-size:23px; }
    .game { background:#fff; padding:23px; border-radius:25px; box-shadow:0 8px 35px #26304006; border:1px solid #ecece7; }
    .round-info { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:19px; }
    .range-title { font-size:11px; color:var(--muted); margin-bottom:4px; }
    .range-value { font:800 23px/1.2 ui-rounded,"Segoe UI",sans-serif; letter-spacing:1px; }
    .attempts { color:#7b8089; font-size:12px; padding:8px 11px; border:1px solid #ecece8; border-radius:10px; white-space:nowrap; }
    .attempts b { color:var(--ink); font-size:15px; margin:0 3px; font-variant-numeric:tabular-nums; }
    .range-track { height:5px; background:#f0f1f5; border-radius:20px; position:relative; margin:-4px 0 23px; overflow:hidden; }
    .range-track span { display:block; height:100%; width:100%; border-radius:20px; background:#b5c2ff; transition:width .25s,margin-left .25s; }
    label { display:block; font-size:13px; font-weight:650; margin-bottom:10px; }
    .input-row { display:flex; align-items:stretch; gap:10px; }
    input { min-width:0; width:100%; background:#f6f7fa; color:var(--ink); border:1px solid #e6e9ef; border-radius:13px; font-size:23px; font-weight:750; height:59px; padding:0 16px; font-variant-numeric:tabular-nums; }
    input::placeholder { font-size:14px; color:#9da3ad; font-weight:400; }
    input:disabled { color:#718074; background:#f1f7f3; }
    .guess-button { flex-shrink:0; border:0; min-width:105px; border-radius:13px; background:var(--blue); color:white; padding:0 18px; font-size:15px; font-weight:750; cursor:pointer; box-shadow:0 4px 0 #2946c7; transition:transform .12s,background .12s; }
    .guess-button:hover { background:#2c4bd4; }
    .guess-button:active { transform:translateY(2px); box-shadow:0 2px 0 #2946c7; }
    .guess-button:disabled { background:#e7ece8; color:#738077; box-shadow:none; cursor:default; }
    .feedback { margin-top:19px; padding:15px; border-radius:13px; background:#f7f8fc; display:flex; gap:11px; align-items:flex-start; min-height:78px; }
    .feedback-icon { flex-shrink:0; font-size:19px; line-height:24px; color:#7b8bc1; }
    .feedback h2 { font-size:14px; line-height:1.6; margin:0; font-weight:750; }
    .feedback p { font-size:12px; line-height:1.65; margin:2px 0 0; color:#7c8290; }
    .feedback[data-state="low"] { background:#fff5e8; }
    .feedback[data-state="low"] .feedback-icon { color:#bc7b25; }
    .feedback[data-state="high"] { background:#edf2ff; }
    .feedback[data-state="high"] .feedback-icon { color:var(--blue); }
    .feedback[data-state="won"] { background:#eaf7ef; }
    .feedback[data-state="won"] h2,.feedback[data-state="won"] .feedback-icon { color:var(--green); }
    .feedback[data-state="error"] { background:#fff0ed; }
    .feedback[data-state="error"] h2,.feedback[data-state="error"] .feedback-icon { color:#b54935; }
    .history-wrap { margin-top:19px; }
    .history-label { font-size:11px; color:#969ba3; margin-bottom:9px; }
    .history { display:flex; flex-wrap:wrap; gap:6px; max-height:105px; overflow-y:auto; }
    .chip { font-size:12px; font-weight:650; padding:6px 9px; background:#f3f4f7; border-radius:8px; color:#747d8d; font-variant-numeric:tabular-nums; }
    .chip[data-result="low"] { color:#a87728; background:#fff4e4; }
    .chip[data-result="high"] { color:#6075b9; background:#eef2ff; }
    .chip[data-result="won"] { color:var(--green); background:#e6f4eb; }
    .new-round { width:100%; min-height:48px; border:0; border-radius:12px; color:white; background:var(--green); font-weight:700; cursor:pointer; margin-top:14px; }
    .new-round:hover { background:#116341; }
    [hidden] { display:none !important; }
    .bottom { text-align:center; padding-top:20px; }
    .share { border:0; background:transparent; color:#616a7a; font-size:12px; padding:10px 14px; min-height:42px; cursor:pointer; }
    .share svg { vertical-align:-3px; margin-right:6px; }
    .share-message { color:var(--green); font-size:12px; margin:3px 0; line-height:1.6; }
    .copy-url { margin-top:9px; font-size:12px; height:42px; font-weight:400; }
    footer { font-size:10px; color:#9a9d9e; letter-spacing:1px; margin-top:9px; }
    @media (max-width:360px) { .shell { width:calc(100% - 28px); padding-top:20px; } .game { padding:19px; } .guess-button { min-width:90px; padding:0 12px; } h1 { font-size:30px; } }
    @media (min-width:700px) { .shell { padding-top:45px; } .topbar { margin-bottom:35px; } .number-stage { height:150px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none !important; scroll-behavior:auto !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">#</span>猜个数</div>
      <button id="restart" class="restart" type="button">↻ 重新开始</button>
    </header>
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">一点直觉，一点推理</p>
      <h1 id="page-title">我心里，有个数。</h1>
      <p class="intro">藏在 <span id="intro-range">1 到 20</span> 之间，猜猜它是谁？</p>
      <div class="number-stage" aria-hidden="true">
        <div class="orbit"></div><span class="float-number left">05</span>
        <div id="mystery" class="mystery">?</div>
        <span class="spark">✦</span><span class="float-number right">12</span>
      </div>
    </section>
    <section class="game" aria-label="猜数字游戏">
      <div class="round-info">
        <div><div id="range-title" class="range-title">可能的范围</div><div id="range-value" class="range-value">1 — 20</div></div>
        <div class="attempts">已猜 <b id="attempt-count">0</b> 次</div>
      </div>
      <div class="range-track" aria-hidden="true"><span id="range-bar"></span></div>
      <form id="guess-form" novalidate>
        <label for="guess-input">你的猜测</label>
        <div class="input-row">
          <input id="guess-input" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="go" placeholder="输入 1～20" aria-describedby="feedback-detail" spellcheck="false">
          <button id="guess-button" class="guess-button" type="submit">猜一下 <span aria-hidden="true">↗</span></button>
        </div>
      </form>
      <div id="feedback" class="feedback" role="status" aria-live="polite" aria-atomic="true" data-state="ready">
        <span id="feedback-icon" class="feedback-icon" aria-hidden="true">✧</span>
        <div><h2 id="feedback-title">从你的第一个直觉开始</h2><p id="feedback-detail">每猜一次，我都会给你一点提示。</p></div>
      </div>
      <div id="history-wrap" class="history-wrap" hidden>
        <div class="history-label">你的猜测记录</div><div id="history" class="history" aria-label="本局猜测记录"></div>
      </div>
      <button id="new-round" class="new-round" type="button" hidden>再玩一局 ↗</button>
    </section>
    <div class="bottom">
      <button id="share" class="share" type="button"><svg aria-hidden="true" width="16" height="17" viewBox="0 0 16 17" fill="none"><path d="M8 11V1m0 0L4.5 4.5M8 1l3.5 3.5M3 7H1.5v8h13V7H13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>分享给朋友，一起猜</button>
      <p id="share-message" class="share-message" role="status" hidden></p>
      <input id="copy-url" class="copy-url" aria-label="游戏分享链接" readonly hidden>
      <footer>给大脑放个小小的假。</footer>
    </div>
    <noscript><p>请在浏览器中启用 JavaScript 后开始游戏。</p></noscript>
  </main>
  <script>
    (() => {
      'use strict';
      // 改变这两个数字，就能改变游戏范围；页面上的范围提示会一起更新。
      const MIN = 1;
      const MAX = 20;
      const el = id => document.getElementById(id);
      const input = el('guess-input');
      let secret, attempts, low, high, finished;

      function feedback(state, title, detail, icon) {
        el('feedback').dataset.state = state;
        el('feedback-title').textContent = title;
        el('feedback-detail').textContent = detail;
        el('feedback-icon').textContent = icon;
      }

      function updateRange() {
        el('range-title').textContent = finished ? '答案就是' : '可能的范围';
        el('range-value').textContent = low === high ? String(low) : `${low} — ${high}`;
        el('range-bar').style.marginLeft = `${(low - MIN) / (MAX - MIN + 1) * 100}%`;
        el('range-bar').style.width = `${(high - low + 1) / (MAX - MIN + 1) * 100}%`;
      }

      function newRound() {
        // 对应 Python 的 secret = random.randint(1, 20)。每局只选一次答案。
        secret = Math.floor(Math.random() * (MAX - MIN + 1)) + MIN;
        attempts = 0;
        low = MIN;
        high = MAX;
        finished = false;
        el('intro-range').textContent = `${MIN} 到 ${MAX}`;
        input.placeholder = `输入 ${MIN}～${MAX}`;
        input.value = '';
        input.disabled = false;
        input.removeAttribute('aria-invalid');
        el('guess-button').disabled = false;
        el('guess-button').innerHTML = '猜一下 <span aria-hidden="true">↗</span>';
        el('attempt-count').textContent = '0';
        el('history').replaceChildren();
        el('history-wrap').hidden = true;
        el('new-round').hidden = true;
        el('mystery').textContent = '?';
        el('mystery').classList.remove('solved');
        el('share-message').hidden = true;
        el('copy-url').hidden = true;
        feedback('ready', '从你的第一个直觉开始', '每猜一次，我都会给你一点提示。', '✧');
        updateRange();
      }

      // 浏览器中，每次点击按钮或按回车，就执行一轮输入与判断。
      el('guess-form').addEventListener('submit', event => {
        event.preventDefault();
        if (finished) return;
        const raw = input.value.trim();
        const number = Number(raw);
        if (!/^\d+$/.test(raw) || !Number.isSafeInteger(number) || number < MIN || number > MAX) {
          feedback('error', `请输入 ${MIN}～${MAX} 的整数`, '有效数字才能计入猜测次数，再试一下吧。', '!');
          input.setAttribute('aria-invalid', 'true');
          input.focus();
          return;
        }
        input.removeAttribute('aria-invalid');
        attempts += 1;
        el('attempt-count').textContent = String(attempts);
        let result, symbol;
        // 对应 Python 的 if / elif / else。
        if (number === secret) {
          finished = true;
          low = high = secret;
          result = 'won';
          symbol = '✓';
          feedback('won', `猜中了！答案是 ${secret}`, `你用 ${attempts} 次找到了它。本局结束，要再来一局吗？`, '✓');
          el('mystery').textContent = String(secret);
          el('mystery').classList.add('solved');
          input.value = String(number);
          input.disabled = true;
          el('guess-button').disabled = true;
          el('guess-button').textContent = '猜中了';
          el('new-round').hidden = false;
          input.blur();
        } else if (number > secret) {
          high = Math.min(high, number - 1);
          result = 'high';
          symbol = '↓';
          feedback('high', '猜大了，往小一点找', '范围缩小了，再猜一次。', '↓');
        } else {
          low = Math.max(low, number + 1);
          result = 'low';
          symbol = '↑';
          feedback('low', '猜小了，往大一点找', '离答案更近了，再猜一次。', '↑');
        }
        updateRange();
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.dataset.result = result;
        chip.textContent = `${number} ${symbol}`;
        chip.setAttribute('aria-label', `第 ${attempts} 次猜 ${number}，${result === 'won' ? '猜中了' : result === 'high' ? '猜大了' : '猜小了'}`);
        el('history').append(chip);
        el('history-wrap').hidden = false;
        el('history').scrollTop = el('history').scrollHeight;
        if (!finished) { input.value = ''; input.focus(); }
      });

      el('restart').addEventListener('click', newRound);
      el('new-round').addEventListener('click', newRound);
      el('share').addEventListener('click', async () => {
        const message = el('share-message');
        message.hidden = false;
        if (!/^https?:$/.test(location.protocol)) {
          message.textContent = '打开游戏的在线链接后，就能分享给朋友。';
          return;
        }
        const url = location.origin + location.pathname;
        const data = { title: '猜个数 · 来试试你的直觉', text: `我心里有个 ${MIN} 到 ${MAX} 的数字，来猜猜看！`, url };
        if (navigator.share) {
          try { await navigator.share(data); message.textContent = '把这份小挑战带给朋友吧。'; return; }
          catch (error) { if (error.name === 'AbortError') { message.hidden = true; return; } }
        }
        try {
          await navigator.clipboard.writeText(url);
          message.textContent = '链接已复制，粘贴发给朋友就能玩。';
        } catch {
          message.textContent = '长按下方链接，即可复制分享。';
          el('copy-url').hidden = false;
          el('copy-url').value = url;
          el('copy-url').focus();
          el('copy-url').select();
        }
      });
      newRound();
    })();
  </script>
</body>
</html>
